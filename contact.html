<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Contact - PixelPakistan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
</head>
<!-- Floating WhatsApp -->
  <a href="https://wa.me/92YOUR_NUMBER_HERE" target="_blank"
     class="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 bg-green-500 hover:bg-green-600 w-14 h-14 sm:w-16 sm:h-16 rounded-full flex items-center justify-center shadow-2xl z-50 text-2xl sm:text-3xl transition-all">
    <i class="fa-brands fa-whatsapp"></i>
  </a>
<body class="bg-zinc-950 text-zinc-100">
  <!-- Navbar -->
  <nav class="bg-black/90 backdrop-blur-md border-b border-emerald-900 fixed top-0 inset-x-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 md:py-5 flex justify-between items-center gap-4">
      <a href="index.html" class="text-2xl sm:text-3xl font-bold tracking-tight">Pixel<span class="text-emerald-500">Pakistan</span></a>
      <div class="hidden md:flex gap-6 lg:gap-8 text-base lg:text-lg font-medium">
        <a href="index.html" class="hover:text-emerald-400">Home</a>
        <a href="services.html" class="hover:text-emerald-400">Services</a>
        <a href="portfolio.html" class="hover:text-emerald-400">Portfolio</a>
        <a href="ai-tools.html" class="hover:text-emerald-400">AI Tools</a>
        <a href="contact.html" class="hover:text-emerald-400 text-emerald-400">Contact</a>
      </div>
      <a href="contact.html" class="hidden md:inline-block bg-emerald-600 hover:bg-emerald-500 px-5 lg:px-6 py-3 rounded-2xl font-semibold whitespace-nowrap">Free Consultation</a>
      <button id="menu-btn" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobile-menu"
              class="md:hidden w-11 h-11 flex items-center justify-center rounded-xl border border-zinc-700 text-xl">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
    <div id="mobile-menu" class="hidden md:hidden bg-black/95 px-4 sm:px-6 pb-5 text-lg font-medium max-h-[calc(100vh-4.5rem)] overflow-y-auto">
      <a href="index.html" class="block py-3 border-b border-zinc-800 hover:text-emerald-400">Home</a>
      <a href="services.html" class="block py-3 border-b border-zinc-800 hover:text-emerald-400">Services</a>
      <a href="portfolio.html" class="block py-3 border-b border-zinc-800 hover:text-emerald-400">Portfolio</a>
      <a href="ai-tools.html" class="block py-3 border-b border-zinc-800 hover:text-emerald-400">AI Tools</a>
      <a href="contact.html" class="block py-3 border-b border-zinc-800 hover:text-emerald-400 text-emerald-400">Contact</a>
      <a href="contact.html" class="mt-4 block text-center bg-emerald-600 hover:bg-emerald-500 px-6 py-3 rounded-2xl font-semibold">Free Consultation</a>
    </div>
  </nav>

  <section class="pt-24 md:pt-28 pb-16 md:pb-20">
    <div class="max-w-2xl mx-auto px-4 sm:px-6">
      <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold text-center mb-4">Get Your Free Strategy Call</h1>
      <p class="text-center text-zinc-400 mb-12">Fill the form and our team will contact you within 24 hours</p>

      <!-- Real Form (Formspree) -->
      <form action="https://formspree.io/f/YOUR_CODE_HERE" method="POST" class="space-y-5 sm:space-y-8">
        <input type="text" name="name" placeholder="Full Name" required
               class="w-full bg-zinc-900 border border-zinc-700 focus:border-emerald-500 rounded-2xl px-5 sm:px-6 py-4 sm:py-5 outline-none">
        
        <input type="tel" name="phone" placeholder="Phone / WhatsApp" required
               class="w-full bg-zinc-900 border border-zinc-700 focus:border-emerald-500 rounded-2xl px-5 sm:px-6 py-4 sm:py-5 outline-none">
        
        <input type="email" name="email" placeholder="Email Address" required
               class="w-full bg-zinc-900 border border-zinc-700 focus:border-emerald-500 rounded-2xl px-5 sm:px-6 py-4 sm:py-5 outline-none">
        
        <textarea name="message" rows="5" placeholder="Tell us about your project..." required
                  class="w-full bg-zinc-900 border border-zinc-700 focus:border-emerald-500 rounded-3xl px-5 sm:px-6 py-4 sm:py-5 outline-none"></textarea>
        
        <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-500 py-5 sm:py-6 text-lg sm:text-xl font-bold rounded-3xl transition-all">
          Submit & Get Free Strategy
        </button>
      </form>
    </div>
  </section>

  <script>
    (function () {
      var btn = document.getElementById("menu-btn");
      var menu = document.getElementById("mobile-menu");
      if (!btn || !menu) return;
      btn.addEventListener("click", function () {
        var open = menu.classList.toggle("hidden") === false;
        btn.setAttribute("aria-expanded", open);
        btn.firstElementChild.className = open ? "fa-solid fa-xmark" : "fa-solid fa-bars";
      });
      window.addEventListener("resize", function () {
        if (window.innerWidth >= 768) menu.classList.add("hidden");
      });
    })();
  </script>
</body>
</html>
